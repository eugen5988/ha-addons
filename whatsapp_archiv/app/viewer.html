<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WA-Archiv"><meta name="theme-color" content="#075e54">
<link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.json">
<title>WhatsApp-Archiv</title>
<style>
:root{--g:#075e54;--acc:#25d366;--bg:#f2f2f7;--card:#fff;--txt:#111;--mut:#8e8e93;--bd:#e5e5ea}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--txt:#f2f2f2;--mut:#8e8e93;--bd:#2c2c2e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 -apple-system,BlinkMacSystemFont,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
header .top{display:flex;align-items:center;gap:10px;min-height:32px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header a,header button{color:#fff;background:none;border:0;font-size:16px;padding:4px 6px;text-decoration:none}
#q{width:100%;margin-top:8px;padding:8px 12px;border-radius:10px;border:0;font-size:16px;background:rgba(255,255,255,.18);color:#fff}
#q::placeholder{color:rgba(255,255,255,.7)}
.list{background:var(--card)}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--bd);cursor:pointer}
.av{width:44px;height:44px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.row .t{flex:1;min-width:0}.row .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--mut)}.row .d{font-size:12px;color:var(--mut);flex:none}
.tabs{display:flex;background:var(--g);padding:0 6px 8px;gap:4px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;border:0;border-radius:8px;padding:7px 6px;background:rgba(255,255,255,.12);color:#fff;font-size:13px}
.tabs button.on{background:#fff;color:var(--g);font-weight:600}
.years{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--bg);position:sticky;top:var(--hh,100px);z-index:4}
.years button{border:1px solid var(--bd);background:var(--card);color:var(--txt);border-radius:14px;padding:4px 11px;font-size:13px;white-space:nowrap}
.years button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:2px}
.mh{grid-column:1/-1;padding:12px 10px 6px;font-size:13px;font-weight:600;color:var(--mut)}
.tile{position:relative;aspect-ratio:1;background:var(--bd);overflow:hidden;cursor:pointer}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile .b{position:absolute;right:5px;bottom:4px;color:#fff;font-size:12px;text-shadow:0 0 3px #000}
.item{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
.item .t{flex:1;min-width:0}.item .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12px;color:var(--mut)}.item audio{width:100%;margin-top:6px;height:34px}
.item a{color:var(--g);font-size:14px;text-decoration:none}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
#lb{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column;touch-action:pan-y}
#lb.on{display:flex}
#lb .bar{display:flex;align-items:center;gap:8px;color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;font-size:13px}
#lb .bar .i{flex:1;min-width:0}#lb .bar b{display:block;font-size:15px}
#lb .bar a,#lb .bar button{color:#fff;background:rgba(255,255,255,.15);border:0;border-radius:8px;padding:6px 10px;font-size:14px;text-decoration:none}
#lb .st{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
#lb .st img,#lb .st video{max-width:100%;max-height:100%;object-fit:contain}
#lb .cap{color:#ddd;font-size:14px;padding:8px 14px calc(env(safe-area-inset-bottom) + 10px);white-space:pre-wrap;max-height:25vh;overflow:auto}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:0;color:#fff;font-size:26px;width:44px;height:64px;border-radius:8px}
#lb .prev{left:6px}#lb .next{right:6px}
@media (hover:none){#lb .nav{display:none}}
#sent{height:40px}
#ov{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column}
#ov.on{display:flex}
#ov .bar{display:flex;align-items:center;gap:8px;background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
#ov .bar b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ov .bar button,#ov .bar a{color:#fff;background:rgba(255,255,255,.15);border:0;border-radius:8px;padding:6px 10px;font-size:14px;text-decoration:none}
#ov iframe{flex:1;border:0;width:100%;background:#fff}
</style></head><body>
<div id="app"></div>
<div id="ov"><div class="bar"><button id="ovx">✕</button><b id="ovt"></b><a id="ovo" target="_blank">Neuer Tab</a></div><iframe id="ovf"></iframe></div>
<div id="lb"><div class="bar"><button id="lbx">✕</button><div class="i"><b id="lbw"></b><span id="lbd"></span></div><a id="lbo" target="_blank">Öffnen</a></div>
<div class="st" id="lbs"></div><div class="cap" id="lbc"></div><button class="nav prev" id="lbp">‹</button><button class="nav next" id="lbn">›</button></div>
<script>
const $=s=>document.querySelector(s);
/* Zugriffs-Token (nur für direkten Aufruf ohne Home Assistant): ?t=… merken und als Cookie mitsenden */
(()=>{try{const t=new URLSearchParams(location.search).get("t");if(t)localStorage.setItem("wa_t",t);const s=localStorage.getItem("wa_t");
 if(s)document.cookie="wa_token="+encodeURIComponent(s)+";path=/;max-age=31536000;SameSite=Lax";}catch(e){}})();
const EMB=(()=>{try{return window.self!==window.top}catch(e){return true}})();
function overlay(u,title){$("#ovf").src=u;$("#ovt").textContent=title||"";$("#ovo").href=u;$("#ovo").style.display=EMB?"none":"";$("#ov").classList.add("on");}
function closeOv(){$("#ov").classList.remove("on");$("#ovf").src="about:blank";}const app=$("#app");const DATA={};let cur=null;
const TABS=[["i","Fotos"],["v","Videos"],["a","Audio"],["d","Dokumente"]];
const MON=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function url(p){return p.split("/").map(encodeURIComponent).join("/");}
function dt(ts,full){if(!ts)return"";const d=new Date(ts*1000);const p=n=>String(n).padStart(2,"0");
 return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}`+(full?` ${p(d.getHours())}:${p(d.getMinutes())}`:"");}
function load(src){return new Promise((ok,err)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>err(src);document.head.appendChild(s);});}
window.WA_LOAD=(id,items)=>{DATA[id]=items;};
function initials(n){return (n.replace(/[^\p{L}\p{N} ]/gu,"").trim().split(/\s+/).map(w=>w[0]).join("").slice(0,2)||"#").toUpperCase();}

/* ---------- Chatliste ---------- */
function list(){cur=null;document.title="WhatsApp-Archiv";
 app.innerHTML=`<header><div class="top"><h1>WhatsApp-Archiv</h1></div><input id="q" type="search" placeholder="Chat suchen …" autocomplete="off"></header><div class="list" id="rows"></div>`;
 const q=$("#q");q.value=sessionStorage.getItem("q")||"";
 const draw=()=>{const v=q.value.toLowerCase();sessionStorage.setItem("q",q.value);
  const rows=WA_CHATS.filter(c=>c.n.toLowerCase().includes(v));
  $("#rows").innerHTML=rows.length?rows.map(c=>{const s=[c.c.i&&`📷 ${c.c.i}`,c.c.v&&`🎬 ${c.c.v}`,c.c.a&&`🎤 ${c.c.a}`,c.c.d&&`📄 ${c.c.d}`].filter(Boolean).join("  ");
   return `<div class="row" data-id="${c.id}"><div class="av">${c.g?"👥":esc(initials(c.n))}</div><div class="t"><div class="n">${esc(c.n)}</div><div class="s">${s}</div></div><div class="d">${dt(c.l)}</div></div>`}).join(""):`<div class="empty">Kein Chat gefunden.</div>`;};
 q.oninput=draw;draw();
 $("#rows").onclick=e=>{const r=e.target.closest(".row");if(r)location.hash=`#/c/${r.dataset.id}`;};
 const y=+sessionStorage.getItem("ly")||0;window.scrollTo(0,y);}

/* ---------- Chat ---------- */
async function chat(id,tab,year){const c=WA_CHATS.find(x=>x.id==id);if(!c){location.hash="";return;}
 if(!DATA[id]){app.innerHTML=`<div class="empty">Lade …</div>`;try{await load(`data/c${id}.js`);}catch(e){app.innerHTML=`<div class="empty">Konnte Daten nicht laden. Ist das NAS erreichbar?</div>`;return;}}
 const all=DATA[id];if(!tab){tab=(TABS.find(t=>c.c[t[0]])||TABS[0])[0];}
 let items=all.filter(x=>x[1]===tab).sort((a,b)=>b[2]-a[2]);
 const years=[...new Set(items.map(x=>new Date(x[2]*1000).getFullYear()))].sort((a,b)=>b-a);
 if(year)items=items.filter(x=>new Date(x[2]*1000).getFullYear()==year);
 cur={id,tab,year,items};document.title=c.n;
 app.innerHTML=`<header id="hd"><div class="top"><a href="#/">‹ Chats</a><h1>${esc(c.n)}</h1>${c.h?`<a href="#" id="chatlink">💬</a>`:""}</div></header>
 <div class="tabs" id="tabs">${TABS.map(([k,l])=>`<button data-t="${k}" class="${k===tab?"on":""}">${l} ${c.c[k]||0}</button>`).join("")}</div>
 ${years.length>1?`<div class="years" id="yrs"><button data-y="" class="${year?"":"on"}">Alle</button>${years.map(y=>`<button data-y="${y}" class="${y==year?"on":""}">${y}</button>`).join("")}</div>`:""}
 <div id="body"></div><div id="sent"></div>`;
 const hd=$("#hd");document.documentElement.style.setProperty("--hh",hd.offsetHeight+"px");
 if($("#chatlink"))$("#chatlink").onclick=e=>{e.preventDefault();overlay("../"+url(c.h),c.n);};
 $("#tabs").onclick=e=>{const b=e.target.closest("button");if(b)location.hash=`#/c/${id}/${b.dataset.t}`;};
 if($("#yrs"))$("#yrs").onclick=e=>{const b=e.target.closest("button");if(b)location.hash=`#/c/${id}/${tab}`+(b.dataset.y?`/${b.dataset.y}`:"");};
 const body=$("#body");if(!items.length){body.innerHTML=`<div class="empty">Keine Einträge.</div>`;return;}
 const visual=tab==="i"||tab==="v";let box=body;if(visual){box=document.createElement("div");box.className="grid";body.appendChild(box);}
 let pos=0,lastM="";
 const more=()=>{const end=Math.min(items.length,pos+(visual?120:60));let h="";
  for(;pos<end;pos++){const it=items[pos];const d=new Date(it[2]*1000);const m=`${MON[d.getMonth()]} ${d.getFullYear()}`;
   if(m!==lastM){lastM=m;h+=`<div class="mh">${m}</div>`;}
   const u=url(it[0]);
   if(tab==="i")h+=`<div class="tile" data-i="${pos}"><img loading="lazy" decoding="async" src="${it[6]?url(it[6]):u}" alt=""></div>`;
   else if(tab==="v")h+=it[6]?`<div class="tile" data-i="${pos}"><img loading="lazy" decoding="async" src="${url(it[6])}" alt=""><span class="b">▶</span></div>`
     :`<div class="tile" data-i="${pos}"><video muted playsinline preload="none" data-src="${u}#t=0.5"></video><span class="b">▶</span></div>`;
   else if(tab==="a")h+=`<div class="item"><div class="t"><div class="n">🎤 ${esc(it[3])}</div><div class="s">${dt(it[2],1)}</div><audio controls preload="none" src="${u}"></audio></div><a href="${u}" class="ext" data-n="${esc(it[3])}">Öffnen</a></div>`;
   else h+=`<div class="item"><div style="font-size:26px">📄</div><div class="t"><div class="n">${esc(it[5]||it[0].split("/").pop())}</div><div class="s">${esc(it[3])} · ${dt(it[2],1)}</div></div><a href="${u}" class="ext" data-n="${esc(it[5]||"Dokument")}">Öffnen</a></div>`;}
  if(visual)box.insertAdjacentHTML("beforeend",h);else body.insertAdjacentHTML("beforeend",h);
  if(tab==="v")box.querySelectorAll("video[data-src]").forEach(v=>vio.observe(v));};
 more();
 if(window._io)window._io.disconnect();
 window._io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)&&pos<items.length)more();},{rootMargin:"1200px"});
 window._io.observe($("#sent"));
 if(!visual)body.onclick=e=>{const a=e.target.closest("a.ext");if(a){e.preventDefault();overlay(a.getAttribute("href"),a.dataset.n);}};
 if(visual)box.onclick=e=>{const t=e.target.closest(".tile");if(t)openLB(+t.dataset.i);};
 window.scrollTo(0,0);}
const vio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const v=e.target;v.src=v.dataset.src;v.preload="metadata";v.removeAttribute("data-src");vio.unobserve(v);}}),{rootMargin:"300px"});

/* ---------- Vollbild ---------- */
let li=0;const lb=$("#lb");
function openLB(i){li=i;lb.classList.add("on");document.body.style.overflow="hidden";showLB();}
function closeLB(){lb.classList.remove("on");document.body.style.overflow="";$("#lbs").innerHTML="";}
function showLB(){const it=cur.items[li];if(!it)return;const u=url(it[0]);
 if(it[1]==="v")$("#lbs").innerHTML=`<video src="${u}" controls playsinline autoplay${it[6]?` poster="${url(it[6])}"`:""}></video>`;
 else{$("#lbs").innerHTML=`<img src="${it[6]?url(it[6]):u}" alt="">`;if(it[6]){const im=new Image();im.onload=()=>{const c=$("#lbs img");if(c&&cur.items[li]===it)c.src=u;};im.src=u;}}
 $("#lbw").textContent=it[3];$("#lbd").textContent=`${dt(it[2],1)} · ${li+1}/${cur.items.length}`;
 $("#lbc").textContent=it[4]||"";$("#lbo").href=u;
 if(EMB){$("#lbo").setAttribute("download",it[0].split("/").pop());$("#lbo").removeAttribute("target");$("#lbo").textContent="Sichern";}
 [li-1,li+1].forEach(j=>{const n=cur.items[j];if(n&&n[1]==="i"){const im=new Image();im.src=url(n[0]);}});}
function step(d){const j=li+d;if(j>=0&&j<cur.items.length){li=j;showLB();}}
$("#lbx").onclick=closeLB;$("#lbp").onclick=()=>step(-1);$("#lbn").onclick=()=>step(1);
let tx=0,ty=0;lb.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
lb.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
 if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))step(dx<0?1:-1);else if(dy>90&&Math.abs(dy)>Math.abs(dx))closeLB();});
document.addEventListener("keydown",e=>{if(!lb.classList.contains("on"))return;if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1);if(e.key==="Escape")closeLB();});

/* ---------- Routing ---------- */
$("#ovx").onclick=closeOv;
function route(){closeLB();closeOv();const m=location.hash.match(/^#\/c\/(\d+)(?:\/(\w))?(?:\/(\d{4}))?/);
 if(m)chat(+m[1],m[2],m[3]?+m[3]:0);else list();}
window.addEventListener("scroll",()=>{if(!cur)sessionStorage.setItem("ly",window.scrollY);},{passive:true});
window.addEventListener("hashchange",route);
load("data/chats.js").then(route).catch(()=>{app.innerHTML=`<div class="empty">Archiv-Daten nicht erreichbar.<br>Ist das NAS online?<br><br><small>Beim direkten Aufruf ohne Home Assistant: Adresse einmal mit <code>?t=ZUGRIFFS-TOKEN</code> öffnen.</small></div>`;});
</script></body></html>
