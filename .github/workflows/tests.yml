name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ausgaben/requirements.txt pillow
      - run: python tests/test_tr.py
      - run: python tests/test_beleg.py
      - run: python tests/test_ki.py
      - run: python tests/test_anteile.py
      - run: python tests/test_offline.py
      - run: python tests/test_update.py
